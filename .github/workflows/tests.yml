name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # pywebview is Windows-desktop only; the offline suite doesn't need it.
        # Filtering into a file (not a shell substitution) keeps inline comments
        # and version specifiers intact.
        run: |
          python -m pip install --upgrade pip
          grep -v '^pywebview' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v
